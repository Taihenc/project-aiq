services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_SERVICE_URL=http://ai:8000/chat
    command: pnpm start
    networks:
      - aingo-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8501:8501'
    volumes:
      - ./apps/web:/app/apps/web
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:3000/chat
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend
      - ai
    networks:
      - aingo-net

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./services/ai:/app/services/ai
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - aingo-net

  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
    ports:
      - '8002:8002'
    volumes:
      - ./services/data-ingestion:/app/services/data-ingestion
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - FILE_STORAGE_URL=http://file-storage-service:8007
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    depends_on:
      - rabbitmq
    networks:
      - aingo-net

  sharepoint-webhook:
    build:
      context: .
      dockerfile: services/sharepoint-webhook/Dockerfile
    ports:
      - '8004:8004'
    volumes:
      - ./services/sharepoint-webhook:/app/services/sharepoint-webhook
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
      - FILE_STORAGE_URL=http://file-storage-service:8007
    env_file:
      - ./services/sharepoint-webhook/.env
    command: python main.py
    depends_on:
      - file-storage-service
    networks:
      - aingo-net

  file-storage-service:
    build:
      context: .
      dockerfile: services/file-storage-service/Dockerfile
    ports:
      - '8007:8007'
    volumes:
      - ./services/file-storage-service:/app/services/file-storage-service
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=ingestion-bucket
      - RABBITMQ_HOST=rabbitmq
    command: uvicorn main:app --host 0.0.0.0 --port 8007
    depends_on:
      - minio
      - rabbitmq
    networks:
      - aingo-net

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - aingo-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - aingo-net

  qdrant:
    image: qdrant/qdrant
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aingo-net

networks:
  aingo-net:
    driver: bridge

volumes:
  qdrant_data:
