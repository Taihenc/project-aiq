services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_ENGINE_BASE_URL=http://ai:8001
    command: pnpm start
    networks:
      - aingo-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://backend:3000
    command: pnpm dev
    depends_on:
      - backend
    networks:
      - aingo-net

  ai:
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    ports:
      - '8001:8001'
    volumes:
      - ./services/ai-engine:/app/services/ai-engine
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    networks:
      - aingo-net

  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
    ports:
      - '8002:8002'
    volumes:
      - ./services/data-ingestion:/app/services/data-ingestion
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - FILE_STORAGE_URL=http://file-storage-service:8007
      - API_URL=http://embedding-service:8003/upload
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    depends_on:
      # - rabbitmq
      - embedding-service
    networks:
      - aingo-net

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    ports:
      - '8003:8003'
    volumes:
      - ./services/embedding-service:/app/services/embedding-service
      - ./turbo.json:/app/turbo.json
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    depends_on:
      - qdrant
    networks:
      - aingo-net

