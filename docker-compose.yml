services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_ENGINE_BASE_URL=http://search-flow:8000
    command: pnpm start
    depends_on:
      - search-flow
    networks:
      - aingo-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://backend:3000
    command: pnpm dev
    depends_on:
      - backend
    networks:
      - aingo-net

  search-flow:
    build:
      context: .
      dockerfile: services/search-flow/Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - ./services/search-flow/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_URL=http://embedding-service:8003/v1/mcp/sse
      - EMBEDDING_SERVICE_URL=http://embedding-service:8003
    depends_on:
      - embedding-service
    networks:
      - aingo-net

  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
    ports:
      - '8002:8002'
    env_file:
      - ./services/data-ingestion/.env
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://embedding-service:8003/v1/upload
    depends_on:
      - embedding-service
    networks:
      - aingo-net

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    ports:
      - '8003:8003'
    env_file:
      - ./services/embedding-service/.env
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - aingo-net

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aingo-net

volumes:
  qdrant_data:

networks:
  aingo-net:
    driver: bridge
