services:
  # ==================== STATELESS SERVICES (with Hot-Reload) ====================

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/data/backend/sqlite.db
      - AI_ENGINE_BASE_URL=http://search-flow:8000
      - SHAREPOINT_WEBHOOK_URL=http://sharepoint-webhook:8004
      - FILE_STORAGE_URL=http://file-storage-service:8004
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/package.json:/app/apps/backend/package.json
      - ./apps/backend/pnpm-lock.yaml:/app/apps/backend/pnpm-lock.yaml
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - /app/node_modules
      - /app/apps/backend/node_modules
      - backend_data:/data/backend
    networks:
      - aingo-net
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
      - INTERNAL_BACKEND_URL=http://backend:3000
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - /app/node_modules
      - /app/apps/web/node_modules
    networks:
      - aingo-net
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"

  search-flow:
    build:
      context: .
      dockerfile: services/search-flow/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./services/search-flow/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - MCP_SERVER_URL=http://embedding-service:8003/v1/mcp/sse
      - EMBEDDING_SERVICE_URL=http://embedding-service:8003
    volumes:
      - ./services/search-flow:/app/services/search-flow
      - ./services/shared/python/aingo_utils:/app/aingo_utils
    networks:
      - aingo-net
    depends_on:
      embedding-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./services/embedding-service/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=/app/models/bge-m3
      - RERANKING_MODEL=/app/models/bge-reranker-v2-m3
    volumes:
      - ./services/embedding-service:/app/services/embedding-service
      - ./models:/app/models
      - embedding_cache:/data/embeddings
    networks:
      - aingo-net
    depends_on:
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8003"

  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./services/data-ingestion/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - API_URL=http://embedding-service:8003/v1/upload
      - RABBITMQ_HOST=rabbitmq
      - FILE_STORAGE_URL=http://file-storage-service:8004
      - EMBEDDING_SERVICE_URL=http://embedding-service:8003
      - EMBED_MODEL_ID=/app/models/bge-m3
    volumes:
      - ./services/data-ingestion:/app/services/data-ingestion
      - ./models:/app/models
      - data_ingestion_uploads:/data/uploaded-files
    networks:
      - aingo-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      file-storage-service:
        condition: service_healthy
    ports:
      - "8002:8002"

  sharepoint-webhook:
    build:
      context: .
      dockerfile: services/sharepoint-webhook/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./services/sharepoint-webhook/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - SERVER_PORT=8004
      - FILE_STORAGE_URL=http://file-storage-service:8004
    volumes:
      - ./services/sharepoint-webhook:/app/services/sharepoint-webhook
      - sharepoint_sync:/data/synced_files
      - sharepoint_logs:/var/log
    networks:
      - aingo-net
    depends_on:
      file-storage-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8004:8004"

  file-storage-service:
    build:
      context: .
      dockerfile: services/file-storage-service/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./services/file-storage-service/.env
    environment:
      - PYTHONUNBUFFERED=1
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - S3_ENDPOINT=http://aingo-minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=ingestion-bucket
      - RABBITMQ_HOST=rabbitmq
      - DB_PATH=/data/file_metadata.db
      - EMBEDDING_SERVICE_URL=http://embedding-service:8003
      - NESTJS_WEBHOOK_URL=http://backend:3000/api/file-storage/webhook
    volumes:
      - ./services/file-storage-service:/app/services/file-storage-service
      - file_storage_data:/data
      - file_storage_db:/data
    networks:
      - aingo-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      aingo-minio:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    ports:
      - "8007:8004"

  # ==================== STATEFUL SERVICES (Lightweight) ====================

  aingo-minio:
    image: minio/minio:latest
    container_name: aingo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    networks:
      - aingo-net
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    networks:
      - aingo-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    networks:
      - aingo-net
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
      - "6334:6334"

networks:
  aingo-net:
    driver: bridge

volumes:
  backend_data:
    driver: local
  file_storage_data:
    driver: local
  file_storage_db:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local
  qdrant_snapshots:
    driver: local
  embedding_cache:
    driver: local
  data_ingestion_uploads:
    driver: local
  sharepoint_sync:
    driver: local
  sharepoint_logs:
    driver: local
