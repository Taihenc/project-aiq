name: CD - Auto-Deploy AINGO Product

# Trigger on every push to the 'main' branch
on:
  push:
    branches:
      - main
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/backend:latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/web:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            INTERNAL_BACKEND_URL=http://backend:3000

      - name: Build and push Search Flow
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/search-flow/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/search-flow:latest

      - name: Build and push Embedding Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/embedding-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/embedding-service:latest

      - name: Build and push Data Ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/data-ingestion/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/data-ingestion:latest

      - name: Build and push SharePoint Webhook
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/sharepoint-webhook/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/sharepoint-webhook:latest

      - name: Build and push File Storage Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/file-storage-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aingo/file-storage-service:latest

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Code via Rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ vars.SSH_HOST }}
          REMOTE_USER: ${{ vars.SSH_USER }}
          TARGET: "~/AINGO"
          EXCLUDE: "/.git/, /node_modules/, /**/node_modules/, .env, Caddyfile, .DS_Store, .claude/, .gemini/"
          REMOTE_PORT: ${{ vars.SSH_PORT || 22 }}

      - name: Execute Docker Compose Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            # 1. Ensure the deployment script on the VM is executable
            chmod +x ~/AINGO/deploy/deploy.sh
            # 2. Run the deployment script (handles docker compose pull & up)
            ~/AINGO/deploy/deploy.sh
