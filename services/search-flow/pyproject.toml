[project]
name = "search-flow-service"
version = "0.1.0"
description = "Search Flow Service"
authors = [
    {name = "AINGO Team"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.3",
    "crewai[azure-ai-inference]>=1.9.3",
    "mcp>=1.23.3",
    "langfuse>=3.14.1",
    "langchain-core>=1.2.16",
    "litellm>=1.75.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
