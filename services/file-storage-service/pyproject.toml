[project]
name = "file-storage-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "aio-pika>=9.4.0",
    "alembic>=1.18.4",
    "boto3>=1.41.0",
    "fastapi>=0.121.3",
    "httpx>=0.27.0",
    "pydantic>=2.12.4",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.38.0",
    "loguru>=0.7.3",
]

[tool.uv]
dev-dependencies = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
