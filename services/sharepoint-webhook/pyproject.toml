[project]
name = "sharepoint-webhook"
version = "0.1.0"
description = "SharePoint webhook service for AINGO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "msal>=1.34.0",
    "pyngrok>=7.2.2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
sharepoint-webhook = "app.main:main"

