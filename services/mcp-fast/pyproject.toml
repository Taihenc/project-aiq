[project]
name = "mcp-fast-server"
version = "0.1.0"
description = "FastMCP server for searching documents via embedding service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "httpx",
    "uvicorn",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
