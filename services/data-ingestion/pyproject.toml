[project]
name = "data-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "fastapi>=0.120.4",
    "pillow>=10.0.0,<12.0.0",
    "python-multipart>=0.0.20",
    "transformers>=4.57.1",
    "uvicorn>=0.38.0",
    "httpx>=0.27.0",
    "pika>=1.3.2",
    "requests>=2.32.0",
    "unstructured>=0.10.0",
    "unstructured-inference>=0.7.11",
    "unstructured[pdf]",
    "pdfminer.six>=20221105",
    "pi-heif>=0.1.0",
    "docling>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[tool.setuptools]
packages = ["ingestion", "workers", "db", "embedding"]

[tool.uv]
dev-dependencies = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
