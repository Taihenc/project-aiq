[project]
name = "ai-engine"
version = "0.1.0"
description = "AI Engine Service"
authors = [
    {name = "AINGO Team"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "motor>=3.3.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "orjson>=3.9.14",
    "loguru>=0.7.3",
    "crewai[azure-ai-inference]>=1.8.1",
    "langchain-tools>=0.1.34",
    "crewai-tools>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
